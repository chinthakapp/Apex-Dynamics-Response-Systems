name: CI - Single Save Decision

on:
  push:
    paths:
      - '.copilot-tracking/rai-plans/negotiate-with-kaiju/**'
  pull_request:
    paths:
      - '.copilot-tracking/rai-plans/negotiate-with-kaiju/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r .copilot-tracking/rai-plans/negotiate-with-kaiju/single-save-decision/requirements.txt
      - name: Run tests
        run: |
          pytest .copilot-tracking/rai-plans/negotiate-with-kaiju/single-save-decision/tests -q
